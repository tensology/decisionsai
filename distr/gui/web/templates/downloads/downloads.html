{% extends "base.html" %}

{% block title %}Download Manager{% endblock %}

{% block head_styles %}
<link rel="stylesheet" href="/static/shared/css/downloads.css">
{% endblock %}

{% block content %}
<div class="downloads-page">
    <div class="downloads-header">
        <h1 class="downloads-title">Download Manager</h1>
        <div class="downloads-header-actions">
            <button type="button" id="downloadsRefreshBtn" class="downloads-btn" hidden>Refresh</button>
            <button type="button" id="downloadsClearBtn" class="downloads-btn" hidden>Clear all</button>
        </div>
    </div>

    <div class="downloads-section downloads-section-main">
        <div id="downloadsList" class="downloads-list"></div>
        <p id="downloadsEmpty" class="downloads-empty">No downloads yet.</p>
    </div>
</div>
{% endblock %}

{% block body_scripts %}
<script src="/static/shared/js/downloads.js"></script>
{% endblock %}
