<dialog class="studio-dialog compact-dialog incoming-link-dialog" id="incoming-link-dialog">
        <form method="dialog" id="incoming-link-form">
            <header><div><span>WhatsApp channel</span><h2 id="incoming-link-title">Link to a board</h2></div><button type="button" class="icon-button" data-dialog-close aria-label="Close board links">×</button></header>
            <div class="incoming-link-dialog-body">
                <p id="incoming-link-summary"></p>
                <div id="incoming-current-links" class="incoming-current-links"></div>
                <label>Add another board<select id="incoming-link-board"></select></label>
            </div>
            <menu><button type="button" data-dialog-close class="secondary-button">Cancel</button><button type="submit" value="default" class="primary-button">Link board</button></menu>
        </form>
    </dialog>
