<section class="development-workspace incoming-workspace hidden" id="incoming-workspace" aria-label="Incoming communications">

                        <nav class="incoming-folder-tabs" role="tablist" aria-label="Incoming folders" aria-orientation="vertical">
                            <button type="button" class="active" id="incoming-folder-whatsapp" data-incoming-filter="whatsapp" role="tab" aria-selected="true" aria-controls="incoming-panel-whatsapp"><span aria-hidden="true">◫</span><strong>WhatsApp</strong><small id="incoming-whatsapp-count">0</small></button>

                                    <article class="incoming-whatsapp-reader" id="incoming-whatsapp-reader" aria-live="polite"></article>
                                </div>
                            </section>
                            <section class="incoming-folder-panel hidden" id="incoming-panel-gmail" role="tabpanel" aria-labelledby="incoming-folder-gmail">

                                    <div class="incoming-gmail-list" id="incoming-gmail-list" aria-label="Gmail inbox threads" aria-live="polite"></div>
                                    <article class="incoming-gmail-reader" id="incoming-gmail-reader" aria-live="polite"></article>
                                </div>
                            </section>

                    </div>
