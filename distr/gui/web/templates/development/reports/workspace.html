<section class="development-workspace reports-workspace hidden" id="reports-workspace" aria-label="Reports">
    <header>
        <strong id="reports-heading">Run history</strong>
        <button type="button" id="reports-refresh" class="secondary-button">Refresh</button>
    </header>
    <p id="reports-description">Recent workflow, automation and standalone execution records. Linked records may describe stages of the same work.</p>
    <div class="reports-tabs" role="tablist" aria-label="Report views">
        <button type="button" class="reports-tab is-active" role="tab" id="reports-tab-runs" data-reports-tab="runs" aria-selected="true">Run history</button>
        <button type="button" class="reports-tab" role="tab" id="reports-tab-time" data-reports-tab="time" aria-selected="false">Time log</button>
    </div>
    <div class="reports-filters" id="reports-run-filters">
        <label>Source<select id="reports-source"><option value="all">All sources</option><option value="workflow">Workflows</option><option value="automation">Automations</option><option value="execution">Standalone executions</option></select></label>
        <label>Status<select id="reports-status"><option value="all">All statuses</option><option value="completed">Completed</option><option value="failed">Failed</option><option value="running">Running</option><option value="cancelled">Cancelled</option></select></label>
    </div>
    <div id="reports-results" aria-live="polite"></div>
</section>
