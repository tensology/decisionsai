<dialog class="studio-dialog" id="board-delete-dialog">
        <form method="dialog" id="board-delete-form">
            <header><div><span>Permanent deletion</span><h2>Delete board and linked data?</h2></div><button type="button" class="icon-button" data-dialog-close aria-label="Close deletion dialog">×</button></header>
            <p>This removes the board, tickets, Development threads, time relationships, and stored snapshot files.</p>
            <label class="check-control"><input id="delete-board-repository" type="checkbox"><span><strong>Also delete repository folder</strong><small id="delete-board-repository-path">No project folder configured</small></span></label>
            <menu><button type="button" data-dialog-close class="secondary-button">Cancel</button><button type="submit" value="default" class="danger-button">Delete permanently</button></menu>
        </form>
    </dialog>
