<dialog class="studio-dialog" id="board-link-dialog">
        <form method="dialog" id="board-link-form">
            <header><div><h2 id="board-link-title">Edit board</h2></div><button type="button" class="icon-button" data-dialog-close aria-label="Close board settings">×</button></header>
            <input id="board-edit-id" type="hidden">
            <label>Board name<input id="board-edit-name" type="text" autocomplete="off" required></label>
            <label>Project folder<div class="folder-input-row"><input id="board-edit-folder" type="text" autocomplete="off" placeholder="Choose the repository folder"><button type="button" class="secondary-button" id="board-folder-browse">Browse...</button></div></label>
            <label>Terminal commands<textarea id="board-edit-terminals" rows="5" placeholder="One command per line"></textarea></label>
            <menu><button type="button" class="danger-button hidden" id="delete-board-button">Delete board</button><span class="menu-spacer"></span><button type="button" data-dialog-close class="secondary-button">Cancel</button><button type="submit" value="default" class="primary-button">Save board</button></menu>
        </form>
    </dialog>
