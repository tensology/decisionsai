<aside class="studio-sidebar" id="studio-sidebar" aria-label="Development boards and threads">
            <div class="sidebar-scroll">
                <div class="sidebar-top-row"><button class="sidebar-new-chat" id="new-thread-button" type="button"><span aria-hidden="true">✎</span> New Thread</button><button class="icon-button sidebar-collapse-toggle" id="sidebar-collapse-toggle" type="button" aria-controls="studio-sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar"></button><button class="icon-button sidebar-close mobile-only" id="sidebar-close" aria-label="Close development boards">×</button></div>
                <div class="sidebar-nav-group sidebar-nav-group-single"><button class="sidebar-nav-row" id="sidebar-incoming-toggle" type="button"><span class="sidebar-nav-icon" aria-hidden="true">↓</span><span>Incoming</span><small id="sidebar-incoming-count">0</small></button></div>
                <div class="sidebar-nav-group"><button class="sidebar-nav-row" id="sidebar-rules-toggle" type="button"><span class="sidebar-nav-icon" aria-hidden="true">⚙</span><span>Automations</span><small id="sidebar-rule-count">0</small></button><button class="sidebar-nav-add" id="sidebar-rule-add" type="button" aria-label="Create automation" title="Create automation">+</button></div>
                <div class="sidebar-nav-group"><button class="sidebar-nav-row" id="sidebar-workflows-toggle" type="button"><span class="sidebar-nav-icon" aria-hidden="true">⟲</span><span>Workflows</span><small id="sidebar-workflow-count">0</small></button><button class="sidebar-nav-add" id="sidebar-workflow-add" type="button" aria-label="New workflow" title="New workflow">+</button></div>
                <div class="sidebar-nav-group sidebar-nav-group-single"><button class="sidebar-nav-row" id="sidebar-terminals-toggle" type="button"><span class="sidebar-nav-icon" aria-hidden="true">›_</span><span>Terminals</span></button></div>
                <div class="sidebar-nav-group sidebar-nav-group-single"><button class="sidebar-nav-row" id="sidebar-reports-toggle" type="button"><span class="sidebar-nav-icon" aria-hidden="true">▤</span><span>Reports</span></button></div>
                <section class="sidebar-bucket sidebar-running-automations hidden" id="running-automations-section" aria-label="Running">
                    <div class="sidebar-section-label">
                        <button class="sidebar-section-toggle" type="button" id="running-automations-toggle" aria-expanded="true" aria-controls="running-automations-content">
                            <span class="chevron" aria-hidden="true">▼</span><span>Running</span><small class="sidebar-section-count" id="running-automations-count"></small>
                        </button>
                    </div>
                    <div id="running-automations-content">
                        <div id="running-automations-group" class="task-list"></div>
                        <button type="button" class="sidebar-show-more hidden" id="running-automations-show-more" aria-controls="running-automations-group" aria-expanded="false">Show more</button>
                    </div>
                </section>
                <section class="sidebar-bucket hidden" id="recents-section" aria-label="Recent">
                    <div class="sidebar-section-label">
                        <button class="sidebar-section-toggle" type="button" id="recents-toggle" aria-expanded="false" aria-controls="recents-content">
                            <span class="chevron" aria-hidden="true">▶</span><span>Recent</span>
                        </button>
                    </div>
                    <div id="recents-content" class="hidden">
                        <div id="recent-task-group" class="task-list"></div>
                        <button type="button" class="sidebar-show-more hidden" id="recents-show-more" aria-controls="recent-task-group" aria-expanded="false">Show more</button>
                    </div>
                </section>
                <section class="sidebar-bucket hidden" id="automation-threads-section" aria-label="Automation threads">
                    <div class="sidebar-section-label">
                        <button class="sidebar-section-toggle" type="button" id="automation-threads-toggle" aria-expanded="false" aria-controls="automation-threads-content">
                            <span class="chevron" aria-hidden="true">▶</span><span>Automations</span><small class="sidebar-section-count" id="automation-threads-count"></small>
                        </button>
                    </div>
                    <div id="automation-threads-content" class="hidden">
                        <div id="automation-thread-group" class="task-list"></div>
                        <button type="button" class="sidebar-show-more hidden" id="automation-threads-show-more" aria-controls="automation-thread-group" aria-expanded="false">Show more</button>
                    </div>
                </section>
                <section class="sidebar-bucket hidden" id="pinned-board-section" aria-label="Pinned">
                    <div class="sidebar-section-label">
                        <button class="sidebar-section-toggle" type="button" id="pinned-section-toggle" aria-expanded="true" aria-controls="pinned-board-content">
                            <span class="chevron" aria-hidden="true">▼</span><span>Pinned</span>
                        </button>
                    </div>
                    <div id="pinned-board-content">
                        <div id="pinned-board-tree" class="project-task-tree"></div>
                        <button type="button" class="sidebar-show-more hidden" id="pinned-board-show-more" aria-controls="pinned-board-tree" aria-expanded="false">Show more</button>
                    </div>
                </section>
                <section class="sidebar-bucket" id="boards-section" aria-label="Boards">
                    <div class="sidebar-section-label">
                        <button class="sidebar-section-toggle" type="button" id="boards-toggle" aria-expanded="true" aria-controls="boards-content">
                            <span class="chevron" aria-hidden="true">▼</span><span>Boards</span>
                        </button>
                        {# Older cached sidebar modules still toggle this label. #}
                        <span class="hidden" id="boards-label">Boards</span>
                        <button type="button" id="new-board-button" aria-label="Create board" title="Create board">+</button>
                    </div>
                    <div id="boards-content">
                        <div id="board-task-tree" class="project-task-tree"></div>
                        <button type="button" class="sidebar-show-more hidden" id="boards-show-more" aria-controls="board-task-tree" aria-expanded="false">Show more</button>
                    </div>
                </section>
                <div id="archived-task-group"></div>
            </div>
            <div class="sidebar-drop-overlay hidden" id="sidebar-drop-overlay" aria-live="polite"><strong>Drop a project folder</strong><span>Adds the folder as a board and project</span></div>

        </aside>
