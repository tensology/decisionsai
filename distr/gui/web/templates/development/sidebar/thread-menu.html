<div class="board-context-menu hidden" id="thread-context-menu" role="menu" tabindex="-1">
            <button type="button" id="thread-context-pin" role="menuitem"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M6 3.5h4l-.6 3.2 1.8 1.6v1.2H4.8V8.3l1.8-1.6zM8 9.5v3"/></svg><span class="context-menu-label">Pin thread</span></button>
            <button type="button" id="thread-context-rename" role="menuitem"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M4 12.5h8M5.5 10.2 10.8 4.9l1.3 1.3-5.3 5.3H5.5z"/></svg><span class="context-menu-label">Rename thread</span></button>
            <button type="button" id="thread-context-edit" role="menuitem"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M9.5 4.2 11.8 6.5 6 12.3H3.7V10z"/><path d="M8.4 5.3l2.3 2.3"/></svg><span class="context-menu-label">Edit thread</span></button>
            {% if development_timer_menu %}
            <p class="context-menu-heading">{{ development_timer_menu.heading }}</p>
            {% for item in development_timer_menu['items'] %}
            <button type="button" id="{{ item.element_id }}" role="menuitem" data-timer-menu-item data-running-label="{{ item.running_label }}" data-stopped-label="{{ item.stopped_label }}" data-running-action="{{ item.running_action }}" data-stopped-action="{{ item.stopped_action }}"><svg aria-hidden="true" viewBox="0 0 16 16">{% if item.key == 'toggle' %}<path d="M5 3.5v9l7-4.5z"/>{% else %}<path d="M12.2 6.2A4.6 4.6 0 1 0 12.5 9M12.2 3.5v2.7H9.5"/>{% endif %}</svg><span class="context-menu-label">{{ item.stopped_label }}</span></button>
            {% endfor %}
            {% endif %}
            <div class="context-menu-divider" role="separator"></div>
            <button type="button" id="thread-context-terminal-toggle" role="menuitem"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z"/></svg><span class="context-menu-label">Start Terminals</span></button>
            <button type="button" id="thread-context-archive" role="menuitem"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3 5h10v1.5H3zm1.5 1.5h7V12h-7zM6.5 8.5h3"/></svg><span class="context-menu-label">Archive thread</span></button>
            <button type="button" class="danger-menu-item" id="thread-context-delete" role="menuitem"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M4 5.5h8M6.5 5.5V4h3v1.5M5.5 5.5 6 13h4l.5-7.5"/></svg><span class="context-menu-label">Delete thread</span></button>
        </div>
