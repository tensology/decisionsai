<dialog class="studio-dialog compact-dialog" id="thread-rename-dialog">
        <form method="dialog" id="thread-rename-form">
            <header><div><span>Thread</span><h2>Rename thread</h2></div><button type="button" class="icon-button" data-dialog-close aria-label="Close rename thread">×</button></header>
            <input id="thread-rename-id" type="hidden">
            <label>Thread name<input id="thread-rename-name" type="text" autocomplete="off" required></label>
            <menu><button type="button" data-dialog-close class="secondary-button">Cancel</button><button type="submit" value="default" class="primary-button">Rename</button></menu>
        </form>
    </dialog>
