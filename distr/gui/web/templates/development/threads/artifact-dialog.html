<dialog class="studio-dialog artifact-dialog" id="artifact-dialog">
        <form method="dialog">
            <header><div><span id="artifact-viewer-kind">Artifact</span><h2 id="artifact-viewer-title">Planning artifact</h2></div><button type="button" class="icon-button" data-dialog-close aria-label="Close">×</button></header>
            <div class="artifact-viewer-meta" id="artifact-viewer-meta"></div>
            <div class="artifact-visual hidden" id="artifact-visual"><img id="artifact-image" alt="Artifact preview"><div class="before-after hidden" id="artifact-before-after"><figure><figcaption>Before</figcaption><img id="artifact-before-image" alt="Before implementation"></figure><figure><figcaption>After</figcaption><img id="artifact-after-image" alt="After implementation"></figure></div></div>
            <pre class="artifact-viewer-content" id="artifact-viewer-content"></pre>
            <menu><button type="button" class="secondary-button hidden" id="artifact-request-changes">Request changes</button><button type="button" class="secondary-button hidden" id="artifact-approve">Approve</button><a class="secondary-button hidden" id="artifact-viewer-link" target="_blank" rel="noopener">Open output</a><button type="button" data-dialog-close class="primary-button">Done</button></menu>
        </form>
    </dialog>
