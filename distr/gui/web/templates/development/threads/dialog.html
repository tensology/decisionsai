<dialog class="studio-dialog" id="thread-dialog">
        <form method="dialog" id="thread-form">
            <header><div><span>Thread</span><h2>Edit thread</h2></div><button type="button" class="icon-button" data-dialog-close aria-label="Close edit thread">×</button></header>
            <input id="thread-dialog-id" type="hidden">
            <label>Board<input id="thread-board-name" type="text" readonly></label>
            <label>Ticket<select id="thread-ticket"><option value="">No ticket</option></select></label>
            <div class="thread-time-field">
                <label>Logged time<input id="thread-time-value" type="text" inputmode="numeric" placeholder="00:00:00" pattern="[0-9]+:[0-5][0-9]:[0-5][0-9]" aria-describedby="thread-time-help"></label>
                <small id="thread-time-help">Hours:minutes:seconds</small>
            </div>
            <menu><button type="button" data-dialog-close class="secondary-button">Cancel</button><button type="submit" value="default" class="primary-button">Save changes</button></menu>
        </form>
    </dialog>
