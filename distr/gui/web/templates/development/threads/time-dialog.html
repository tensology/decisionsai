<dialog class="studio-dialog" id="time-dialog">
        <form method="dialog" id="time-form">
            <header><div><span>Thread time</span><h2>Edit Time</h2></div><button type="button" class="icon-button" data-dialog-close aria-label="Close time dialog">×</button></header>
            <div class="time-editor-value" id="time-editor-value">00:00:00</div>
            <div class="thread-lifecycle-actions"><button type="button" class="secondary-button" id="time-play-button">Play</button><button type="button" class="secondary-button" id="time-pause-button">Pause</button><button type="button" class="danger-text-button" id="time-reset-button">Reset time</button></div>
            <menu><button type="button" data-dialog-close class="primary-button">Done</button></menu>
        </form>
    </dialog>
