<h1>Google Workspace Connection Test Results</h1>

<div style="background-color: #0f1a2c; padding: 20px; border-radius: 5px; margin: 20px 0; font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.6; max-height: 600px; overflow-y: auto;">
    <pre style="color: #cccccc; margin: 0; white-space: pre-wrap; word-wrap: break-word; font-family: 'Courier New', monospace;">{test_output}</pre>
</div>

<div style="text-align: center; margin-top: 20px;">
    <button onclick="window.close()" class="big-button" style="display: inline-block; text-align: center; cursor: pointer; border: none; font-size: 16px; padding: 12px 24px;">Close Window</button>
</div>
