<h2 class="text-xl font-semibold text-white mb-2">Initiative</h2>
<p class="text-sm text-gray-400 mb-6">Choose how proactive Hermes should be across your day. Approvals should become conversations, not a growing web inbox.</p>

<div id="initiative-health" class="flex items-center gap-2 mb-6 text-xs text-gray-400" role="status">
    <span id="initiative-health-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-gray-500 shrink-0" title=""></span>
    <span id="initiative-health-label">Cycle status: checking…</span>
</div>

<!-- Proactivity Level -->
<div class="mb-8">
    <label class="block text-sm font-medium text-gray-300 mb-3">Hermes posture</label>
    <div id="initiative-level" class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <button type="button" class="initiative-btn p-4 rounded-lg border border-white/15 text-left transition-all hover:border-white/30" data-level="observe">
            <div class="text-sm font-medium text-white mb-1">Quiet</div>
            <div class="text-xs text-gray-400">Only respond when you ask.</div>
        </button>
        <button type="button" class="initiative-btn p-4 rounded-lg border border-white/15 text-left transition-all hover:border-white/30" data-level="assist">
            <div class="text-sm font-medium text-white mb-1">Assist</div>
            <div class="text-xs text-gray-400">Notice patterns and suggest next steps.</div>
        </button>
        <button type="button" class="initiative-btn p-4 rounded-lg border border-white/15 text-left transition-all hover:border-white/30" data-level="operate">
            <div class="text-sm font-medium text-white mb-1">Standup</div>
            <div class="text-xs text-gray-400">Triage sources, ask decisions in Telegram, run approved routines.</div>
        </button>
        <button type="button" class="initiative-btn p-4 rounded-lg border border-white/15 text-left transition-all hover:border-white/30" data-level="own">
            <div class="text-sm font-medium text-white mb-1">Own outcomes</div>
            <div class="text-xs text-gray-400">Follow through automatically inside defined boundaries.</div>
        </button>
    </div>
    <input type="hidden" id="initiative_level" value="assist">
</div>

<div class="mb-8 rounded-lg border border-white/10 bg-white/[0.03] p-4">
    <div class="text-sm font-medium text-white mb-2">What this means</div>
    <div id="initiative-posture-summary" class="text-sm text-gray-300">Hermes will suggest useful next steps when it sees them.</div>
</div>

<details class="mb-6 rounded-lg border border-white/10 bg-black/10">
    <summary class="cursor-pointer select-none px-4 py-3 text-sm font-medium text-gray-300">Advanced source and safety controls</summary>
    <div class="px-4 pb-4 pt-1 grid grid-cols-1 md:grid-cols-2 gap-3 text-sm text-gray-300">
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_allow_telegram" class="accent-[#f97316] w-4 h-4"> Telegram conversations</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_allow_routine_tasks" class="accent-[#f97316] w-4 h-4"> Routine execution</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_allow_ticket_lane_moves" class="accent-[#f97316] w-4 h-4"> Ticket lane moves</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_allow_workflow_start" class="accent-[#f97316] w-4 h-4"> Workflow starts</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_allow_project_cli" class="accent-[#f97316] w-4 h-4"> Project agent runs</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_scan_boards" class="accent-[#f97316] w-4 h-4" checked> Local boards</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_suggest_backlog_promotion" class="accent-[#f97316] w-4 h-4" checked> Backlog promotion</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_scan_whatsapp" class="accent-[#f97316] w-4 h-4" checked> WhatsApp</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_scan_telegram" class="accent-[#f97316] w-4 h-4" checked> Telegram</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_scan_external_boards" class="accent-[#f97316] w-4 h-4"> Jira/Trello details</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_scan_email" class="accent-[#f97316] w-4 h-4"> Email</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_ask_external_comms" class="accent-[#f97316] w-4 h-4" checked> Ask before external sends</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_ask_file_changes" class="accent-[#f97316] w-4 h-4" checked> Ask before file changes</label>
        <label class="flex items-center gap-3"><input type="checkbox" id="initiative_ask_sensitive" class="accent-[#f97316] w-4 h-4" checked> Ask before sensitive actions</label>
    </div>
</details>
