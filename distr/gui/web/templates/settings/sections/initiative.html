<div class="flex items-start justify-between gap-4 mb-6">
    <div>
        <h2 class="text-xl font-semibold text-white mb-2">Initiative</h2>
        <p class="text-sm text-gray-400">
            <span class="block">Choose how proactive the agent should be across your day.</span>
        </p>
    </div>
    <div id="initiative-health" class="shrink-0" role="status">
        <div id="initiative-health-badge" class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1.5 text-xs text-gray-300">
            <span id="initiative-health-dot" class="inline-block h-2.5 w-2.5 rounded-full bg-gray-500 shrink-0" title=""></span>
            <span id="initiative-health-label">Checking…</span>
        </div>
    </div>
</div>

<hr class="border-white/10 mb-6">

<!-- Proactivity Level -->
<div class="mb-8">
    <label class="block text-sm font-medium text-gray-300 mb-3">Agent posture</label>
    <div id="initiative-level" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button type="button" class="initiative-btn p-5 rounded-lg border border-white/15 text-left transition-all hover:border-white/30" data-level="observe">
            <div class="flex items-start gap-3">
                <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/8 text-[#f8fafc] shrink-0">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V4a2 2 0 10-4 0v1.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0a3 3 0 11-6 0m6 0H9"/></svg>
                </div>
                <div class="min-w-0">
                    <div class="text-sm font-medium text-white mb-1">Quiet</div>
                    <div class="text-xs text-gray-300 leading-relaxed">Only respond when you ask. Best when you want manual control and minimal interruption.</div>
                </div>
            </div>
        </button>
        <button type="button" class="initiative-btn p-5 rounded-lg border border-white/15 text-left transition-all hover:border-white/30" data-level="assist">
            <div class="flex items-start gap-3">
                <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/8 text-[#60a5fa] shrink-0">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div class="min-w-0">
                    <div class="text-sm font-medium text-white mb-1">Assist</div>
                    <div class="text-xs text-gray-300 leading-relaxed">Notice patterns and suggest next steps. Useful when you want momentum without automatic execution.</div>
                </div>
            </div>
        </button>
        <button type="button" class="initiative-btn p-5 rounded-lg border border-white/15 text-left transition-all hover:border-white/30" data-level="operate">
            <div class="flex items-start gap-3">
                <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/8 text-[#f97316] shrink-0">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 17v-2a4 4 0 014-4h8m0 0l-3-3m3 3l-3 3M5 7h8a4 4 0 014 4v2"/></svg>
                </div>
                <div class="min-w-0">
                    <div class="text-sm font-medium text-white mb-1">Standup</div>
                    <div class="text-xs text-gray-300 leading-relaxed">Triage sources, ask decisions in Telegram, and run approved routines while keeping you in the loop.</div>
                </div>
            </div>
        </button>
        <button type="button" class="initiative-btn p-5 rounded-lg border border-white/15 text-left transition-all hover:border-white/30" data-level="own">
            <div class="flex items-start gap-3">
                <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-white/8 text-[#34d399] shrink-0">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 13l4 4L19 7"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M5 19h14"/></svg>
                </div>
                <div class="min-w-0">
                    <div class="text-sm font-medium text-white mb-1">Own outcomes</div>
                    <div class="text-xs text-gray-300 leading-relaxed">Follow through automatically inside defined boundaries and only surface sensitive or unclear decisions.</div>
                </div>
            </div>
        </button>
    </div>
    <input type="hidden" id="initiative_level" value="assist">
</div>

<div class="mb-6 rounded-lg border border-white/10 bg-black/10 p-4">
    <div class="flex items-start justify-between gap-4 mb-4">
        <div>
            <div class="text-sm font-medium text-white mb-1">Advanced source and safety controls</div>
            <div class="text-xs text-gray-400">Permissions that define where Initiative can look, act, and when it must ask first.</div>
        </div>
        <button type="button" id="initiative-inline-save" class="shrink-0 px-4 py-2 rounded-md bg-[#f97316] hover:bg-[#ea580c] text-white text-sm font-medium transition-colors">Save</button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm text-gray-300">
        <label class="settings-toggle"><input type="checkbox" id="initiative_allow_telegram" class="settings-toggle__input"><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Telegram conversations</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_allow_routine_tasks" class="settings-toggle__input"><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Routine execution</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_allow_ticket_lane_moves" class="settings-toggle__input"><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Ticket lane moves</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_allow_workflow_start" class="settings-toggle__input"><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Workflow starts</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_allow_project_cli" class="settings-toggle__input"><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Project agent runs</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_scan_boards" class="settings-toggle__input" checked><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Local boards</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_suggest_backlog_promotion" class="settings-toggle__input" checked><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Backlog promotion</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_scan_whatsapp" class="settings-toggle__input" checked><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">WhatsApp</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_scan_telegram" class="settings-toggle__input" checked><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Telegram</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_scan_external_boards" class="settings-toggle__input"><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Jira/Trello details</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_scan_email" class="settings-toggle__input"><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Email</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_ask_external_comms" class="settings-toggle__input" checked><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Ask before external sends</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_ask_file_changes" class="settings-toggle__input" checked><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Ask before file changes</span></label>
        <label class="settings-toggle"><input type="checkbox" id="initiative_ask_sensitive" class="settings-toggle__input" checked><span class="settings-toggle__switch" aria-hidden="true"></span><span class="settings-toggle__label">Ask before sensitive actions</span></label>
    </div>
</div>
