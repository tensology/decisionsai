<div class="mb-6 flex items-center justify-between gap-4 pb-4 border-b border-[#565869]">
    <div class="flex items-start gap-4 min-w-0">
        <div id="thirdparty_section_icon" class="hidden h-14 w-14 shrink-0 items-center justify-center rounded-xl bg-white/95 p-2 shadow-sm"></div>
        <div class="min-w-0">
        <h2 id="thirdparty_section_title" class="text-xl font-semibold text-white mb-1">Third Party Vendors</h2>
        <p id="thirdparty_section_subtitle" class="text-sm text-gray-400">Manage vendor API keys, connected accounts, and MCP servers from one place.</p>
        </div>
    </div>
    <button type="button" id="thirdparty_section_back"
            class="hidden px-3 py-1.5 rounded-md text-sm font-medium bg-[#0d1117] border border-[#565869] text-[#ececf1] hover:border-[#7a7c8c] hover:text-white transition-colors">
        ← Back
    </button>
</div>

<div id="thirdparty_content_wrap" class="relative space-y-6">
    <div class="llm-settings-layout">
        <div id="thirdparty_subtabs" class="llm-config-tabs" role="tablist" aria-label="Third party vendor sections">
            <button type="button" class="llm-config-tab is-active" data-thirdparty-subtab="api_keys" role="tab" aria-selected="true">API Keys</button>
            <button type="button" class="llm-config-tab" data-thirdparty-subtab="connect" role="tab" aria-selected="false">Connect</button>
            <button type="button" class="llm-config-tab" data-thirdparty-subtab="mcp" role="tab" aria-selected="false">MCP Servers</button>
        </div>

        <div class="llm-config-panel is-active" data-thirdparty-panel="api_keys">
            <div class="border border-[#565869] rounded-lg rounded-tl-none p-6 bg-[#1a1f3a]">
                <div id="thirdparty_provider_grid" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <!-- Dynamically populated -->
                </div>
                <div id="thirdparty_provider_detail" class="hidden"></div>
            </div>
        </div>

        <div class="llm-config-panel" data-thirdparty-panel="connect">
            <div class="border border-[#565869] rounded-lg rounded-tl-none p-6 bg-[#1a1f3a]">
                <div id="thirdparty_connect_grid" class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <!-- Dynamically populated -->
                </div>
                <div id="thirdparty_connect_detail" class="hidden"></div>
            </div>
        </div>

        <div class="llm-config-panel" data-thirdparty-panel="mcp">
            <div class="border border-[#565869] rounded-lg rounded-tl-none p-6 bg-[#1a1f3a]">
                {% include "settings/sections/mcp.html" %}
            </div>
        </div>
    </div>
</div>
