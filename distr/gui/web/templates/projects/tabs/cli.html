<div id="tab-cli" class="project-tab-pane hidden flex flex-col gap-2 p-2 flex-1 min-h-0 overflow-hidden relative">
    <div id="terminal-container" class="flex-1 min-h-0 overflow-y-auto rounded border border-white/10 bg-[#0d1117] font-mono text-sm leading-relaxed relative flex flex-col">
        <div id="cli-session-header" class="sticky top-0 z-30 flex flex-wrap items-start gap-x-3 gap-y-2 border-b border-white/10 bg-[#0d1117]/95 backdrop-blur-sm px-3 py-2.5 shadow-[0_6px_16px_rgba(0,0,0,0.35)]">
            <div class="flex flex-wrap items-center gap-2 shrink-0">
                <select id="terminal-backend-select" class="project-cli-select w-[18rem] max-w-full px-3 py-1.5 bg-[#152054] border border-white/20 rounded text-gray-200 text-xs focus:border-[#f97316] focus:outline-none cursor-pointer" title="Select project coding CLI backend" aria-label="Project coding CLI backend">
                    <option value="pi">Pi</option>
                </select>
            </div>
            <div id="terminal-last-question-wrap" class="hidden flex-1 min-w-[min(100%,200px)] min-h-0">
                <div class="text-[10px] uppercase tracking-wide text-gray-500 mb-0.5">Last sent</div>
                <p id="terminal-last-question-text" class="text-xs text-amber-100/95 leading-snug line-clamp-3 whitespace-pre-wrap break-words"></p>
            </div>
            <div id="cli-header-actions" class="flex flex-col gap-1.5 items-stretch shrink-0 w-full min-[520px]:w-auto min-[520px]:min-w-[13.5rem] max-w-full ml-auto">
                <div class="flex flex-wrap items-center justify-end gap-2">
                    <span id="terminal-status" class="w-2 h-2 rounded-full bg-gray-500 shrink-0"></span>
                    <span id="terminal-status-text" class="text-xs text-gray-400 whitespace-nowrap">Not connected</span>
                    <button type="button" id="terminal-restart" class="text-xs px-2 py-1 rounded border border-white/20 text-gray-300 hover:bg-white/10 hover:text-white" title="Restart terminal"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></button>
                    <button type="button" id="terminal-overview" class="text-xs px-2 py-1 rounded bg-[#f97316] text-white hover:bg-[#ea580c]" title="Summarize terminal output via AI and read aloud">Read Overview</button>
                </div>
                <span id="terminal-activity" class="hidden w-full min-h-9 items-center justify-center gap-1.5 text-xs px-2.5 py-2 rounded-md border text-gray-300 box-border leading-none">
                    <span id="terminal-activity-spinner" class="hidden w-3 h-3 border border-orange-300/60 border-t-transparent rounded-full animate-spin shrink-0"></span>
                    <span id="terminal-activity-text" class="leading-none text-center">Idle</span>
                </span>
            </div>
        </div>
        <div id="terminal-preflight-panel" class="hidden mx-3 mt-2 rounded-lg border border-amber-500/40 bg-amber-950/30 text-sm" role="alert" aria-live="polite">
            <div class="flex items-start justify-between gap-2 px-3 py-2 border-b border-amber-500/25">
                <div class="min-w-0">
                    <p id="terminal-preflight-title" class="text-xs font-semibold uppercase tracking-wide text-amber-200">CLI setup check</p>
                    <p id="terminal-preflight-summary" class="text-xs text-amber-100/90 mt-0.5 leading-snug"></p>
                </div>
                <button type="button" id="terminal-preflight-dismiss" class="shrink-0 text-amber-200/70 hover:text-white text-lg leading-none px-1" title="Dismiss until next check">&times;</button>
            </div>
            <ul id="terminal-preflight-checks" class="px-3 py-2 space-y-1 text-xs text-gray-200"></ul>
            <div id="terminal-preflight-actions" class="flex flex-wrap gap-2 px-3 pb-3"></div>
        </div>
        <div id="terminal-preflight-ok" class="hidden mx-3 mt-2 rounded-lg border border-emerald-500/35 bg-emerald-950/25 px-3 py-2 text-xs text-emerald-100 flex items-center justify-between gap-2">
            <span id="terminal-preflight-ok-text">CLI ready — you can send prompts.</span>
            <button type="button" id="terminal-preflight-recheck-ok" class="text-[10px] uppercase tracking-wide text-emerald-300/90 hover:text-white">Re-check</button>
        </div>
        <section id="terminal-cli-setup-panel" class="mx-3 mt-2 rounded border border-white/10 bg-[#101827]/80">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-white/10 px-3 py-2">
                <div>
                    <h3 class="text-xs font-semibold text-white">CLI setup</h3>
                    <p class="text-[11px] text-gray-400">Enable a CLI, store its credential here, then test the connection and model list.</p>
                </div>
                <button type="button" id="terminal-cli-setup-refresh" class="text-[10px] uppercase tracking-wide text-orange-300 hover:text-white">Refresh</button>
            </div>
            <div id="terminal-cli-setup-list" class="grid gap-2 p-3 md:grid-cols-2"></div>
        </section>
        <div id="terminal-transcript" class="flex-1 min-h-0 px-3 py-3 pb-6"></div>
    </div>
    <div class="flex gap-2 px-1 items-center">
        <input type="text" id="terminal-input" class="flex-1 px-3 py-2 bg-[#152054] border border-[#f97316]/40 rounded text-white placeholder-gray-400 focus:border-[#f97316] focus:outline-none text-sm" placeholder="What would you like to build or do with this project?">
        <select id="terminal-model-select" class="project-cli-select w-[16rem] max-w-[45vw] px-3 py-2 bg-[#152054] border border-white/20 rounded text-gray-300 text-xs focus:border-[#f97316] focus:outline-none cursor-pointer" title="Select CLI model">
            <option value="">Loading models...</option>
        </select>
        <button type="button" id="terminal-input-send" class="text-xs px-3 py-2 rounded bg-[#f97316] text-white hover:bg-[#ea580c] font-medium" title="Send instruction to the selected project CLI backend"><svg class="w-3.5 h-3.5 inline-block mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>Send</button>
    </div>
    <div id="terminal-overview-overlay" class="hidden absolute bottom-4 left-4 right-4 bg-[#1a1f3a]/95 border border-[#f97316]/40 rounded-lg p-4 backdrop-blur-sm z-40">
        <div class="flex items-start justify-between gap-3">
            <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                    <svg class="w-4 h-4 text-[#f97316]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M12 6a7 7 0 010 12"/></svg>
                    <span class="text-xs font-medium text-[#f97316]">AI Overview</span>
                </div>
                <p id="terminal-overview-text" class="text-sm text-gray-200"></p>
            </div>
            <button type="button" id="terminal-overview-close" class="text-gray-400 hover:text-white text-lg leading-none">&times;</button>
        </div>
    </div>
</div>
