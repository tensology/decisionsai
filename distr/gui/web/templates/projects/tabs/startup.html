<div id="tab-startup" class="project-tab-pane hidden flex min-h-0 flex-1 flex-col overflow-hidden">
    <!-- Inner scroll area: padding here so textarea / terminal cards stay clear of the scrollbar -->
    <div id="tab-startup-inner-scroll" class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto overscroll-contain box-border">
    <div>
        <label class="block text-sm text-gray-400 mb-1">Startup instructions</label>
        <p class="text-xs text-gray-500 mb-1">Put one command per line. After you start them, each line gets its own terminal panel below — live output from each command appears in its panel.</p>
        <textarea id="detail-startup" rows="6" class="startup-instructions-input w-full max-w-full text-white placeholder-gray-500 focus:border-[#f97316] focus:outline-none resize-y" placeholder="npm run dev&#10;python manage.py runserver"></textarea>
        <div id="startup-actions-row" class="flex flex-wrap items-center w-full gap-y-2 mt-3">
            <div class="flex flex-wrap items-center gap-3">
                <button type="button" id="startup-start-btn" class="bg-[#22c55e] text-white px-4 py-2 rounded text-sm font-medium hover:bg-[#16a34a] transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Start All Terminals
                </button>
                <button type="button" id="startup-terminate-all-btn" class="hidden bg-[#ef4444] text-white px-4 py-2 rounded text-sm font-medium hover:bg-[#dc2626] transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Terminate All
                </button>
            </div>
            <label id="startup-time-tracker-label" class="startup-time-tracker-label flex items-center gap-2 text-sm text-gray-300 cursor-pointer">
                <input type="checkbox" id="detail-start-time-tracker" class="accent-[#f97316]" checked>
                <span>Start time tracker on <a href="/automations/#calendar" class="text-[#f97316] hover:underline" onclick="event.stopPropagation()">calendar</a></span>
            </label>
        </div>
    </div>
    <div id="startup-terminal-grid" class="hidden grid grid-cols-2 gap-4 mt-4"></div>
    </div>
</div>
