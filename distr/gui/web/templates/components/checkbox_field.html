{# Reusable checkbox field component
   Usage: {% include 'components/checkbox_field.html' with {
       label: "Enable Feature",
       id: "checkbox_id",
       checked: true,
       description: "Optional description text"
   } %}
#}
<div class="mb-4">
    <label class="flex items-start cursor-pointer group">
        <input
            type="checkbox"
            id="{{ id }}"
            name="{{ id }}"
            class="mt-1 w-4 h-4 bg-[#1a1f3a] border border-[#565869] rounded
                   checked:bg-[#10a37f] checked:border-[#10a37f]
                   focus:outline-none focus:ring-2 focus:ring-[#10a37f] focus:ring-offset-0
                   transition-colors cursor-pointer"
            {% if checked %}checked{% endif %}
            {{ 'disabled' if disabled else '' }}
        >
        <div class="ml-3 flex-1">
            <span class="text-sm font-medium text-gray-300 group-hover:text-white transition-colors">
                {{ label }}
            </span>
            {% if description %}
            <p class="text-xs text-gray-400 mt-1">{{ description }}</p>
            {% endif %}
        </div>
    </label>
</div>
