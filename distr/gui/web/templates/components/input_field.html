{# Reusable input field component
   Usage: {% include 'components/input_field.html' with {
       label: "Field Label",
       id: "field_id",
       type: "text",
       placeholder: "Enter value",
       value: ""
   } %}
#}
<div class="mb-4">
    <label for="{{ id }}" class="block text-sm font-medium text-gray-300 mb-2">
        {{ label }}
    </label>
    <input
        type="{{ type|default('text') }}"
        id="{{ id }}"
        name="{{ id }}"
        value="{{ value|default('') }}"
        placeholder="{{ placeholder|default('') }}"
        class="w-full bg-[#1a1f3a] border border-[#565869] rounded-md px-4 py-2 text-white
               focus:outline-none focus:border-[#10a37f] transition-colors
               hover:border-[#7a7c8c]"
        {{ 'disabled' if disabled else '' }}
    >
</div>
