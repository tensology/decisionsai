name: spotify-program-e2e

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "distr/**"
      - "scripts/workflow_ticket_loop_e2e.py"
      - "scripts/run_workflow_ticket_loop_e2e.sh"
      - "tests/core/test_spotify_program_live_e2e.py"
      - "requirements.txt"

jobs:
  spotify-program:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start server
        run: |
          python bin/decisions.sh start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/workflows/ && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/workflows/

      - name: Run Spotify program E2E
        run: |
          WORKFLOW_E2E_PROFILE=spotify ./scripts/run_workflow_ticket_loop_e2e.sh -q
