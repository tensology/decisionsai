name: DecisionsAI release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: decisions-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-workflows:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      DECISIONS_AI_SKIP_MODEL_PREFETCH: "1"
      DECISIONS_SKIP_UI_SCREEN_CAPTURE: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Prepare evidence directory
        run: |
          git status --porcelain=v1 > "$RUNNER_TEMP/release-worktree.txt"
          test ! -s "$RUNNER_TEMP/release-worktree.txt"
          mkdir -p artifacts
          printf '%s\n' "$GITHUB_SHA" > artifacts/release-commit.txt
          mv "$RUNNER_TEMP/release-worktree.txt" artifacts/release-worktree.txt
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          check-latest: true
          cache: pip
      - name: Install system dependencies
        run: brew install portaudio ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install PyInstaller==6.16.0
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Verify supported runtime
        run: |
          python scripts/verify_runtime.py --json > artifacts/runtime-contract.json
          cat artifacts/runtime-contract.json
      - name: Verify collection
        run: python -m pytest --collect-only -q
      - name: Run default test suite
        run: python -m pytest -q --junitxml=artifacts/pytest-default.xml
      - name: Summarize default-suite failures
        if: failure() && hashFiles('artifacts/pytest-default.xml') != ''
        run: >-
          python scripts/summarize_pytest_junit.py
          artifacts/pytest-default.xml --github-annotations
      - name: Run multi-ticket workflow acceptance chain
        run: >-
          python -m pytest -q
          tests/core/test_principle_workflow_chain_e2e.py::test_principle_workflow_chain_ideation_development_polish
          --junitxml=artifacts/pytest-workflow-chain.xml
      - name: Start local Mission Control server
        env:
          DECISIONS_DATA_DIR: ${{ runner.temp }}/browser-state
        run: |
          rm -rf "$DECISIONS_DATA_DIR"
          python -m uvicorn distr.gui.web.server:create_app --factory --host 127.0.0.1 --port 8765 > artifacts/web-server.log 2>&1 &
          echo $! > artifacts/web-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8765/workflows/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/web-server.log
          exit 1
      - name: Run canonical workflow browser journey
        env:
          DECISIONS_DATA_DIR: ${{ runner.temp }}/browser-state
          # Keep the UI journey deterministic on a clean runner. Provider-specific
          # routing is covered separately; this gate verifies that the chosen route
          # and model remain visible through preview, loop, runs, and reporting.
          WORKFLOW_E2E_IDE_BACKEND: pi
          WORKFLOW_E2E_IDE_MODEL: auto
        run: >-
          python -m pytest -q -m e2e_playwright
          tests/ui/test_workflow_ticket_loop_browser_playwright_e2e.py
          --browser chromium
          --junitxml=artifacts/pytest-browser.xml
      - name: Summarize browser-journey failures
        if: failure() && hashFiles('artifacts/pytest-browser.xml') != ''
        run: >-
          python scripts/summarize_pytest_junit.py
          artifacts/pytest-browser.xml --github-annotations
      - name: Build and lifecycle-test unsigned macOS artifact
        run: |
          DECISIONSAI_OUTPUT_DIR="$RUNNER_TEMP/release" installer/build_app.sh --app-only
          DECISIONSAI_INSTALL_DIR="$RUNNER_TEMP/Applications" \
            DECISIONSAI_STATE_DIR="$RUNNER_TEMP/DecisionsAI-state" \
            installer/install.sh "$RUNNER_TEMP/release/DecisionsAI.app"
          DECISIONSAI_INSTALL_DIR="$RUNNER_TEMP/Applications" \
            DECISIONSAI_STATE_DIR="$RUNNER_TEMP/DecisionsAI-state" \
            installer/install.sh --verify
          python installer/smoke_app.py "$RUNNER_TEMP/Applications/DecisionsAI.app"
          cp "$RUNNER_TEMP/release/SHA256SUMS" artifacts/release-SHA256SUMS
          cp "$RUNNER_TEMP/release/DecisionsAI.app/Contents/Info.plist" artifacts/release-Info.plist
      - name: Stop local server
        if: always()
        run: test ! -f artifacts/web-server.pid || kill "$(cat artifacts/web-server.pid)" || true
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-evidence
          path: artifacts/

  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare evidence directory
        run: mkdir -p artifacts
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          check-latest: true
      - name: Compile Python sources
        run: python -m compileall -q distr scripts tests
      - name: Check patch integrity
        run: git diff-tree --check --no-commit-id -r HEAD
      - name: Run Fallow structural audit
        run: |
          npx --yes fallow audit --format json --quiet > artifacts/fallow.json
          cat artifacts/fallow.json
      - name: Upload static audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-static-evidence
          path: artifacts/
