[pytest]
# tests/audio/conftest.py runs scripts/prefetch_local_models.py once per session unless
# DECISIONS_AI_SKIP_MODEL_PREFETCH=1.
pythonpath = .
markers =
    llm_verification: Ollama-backed tool-routing checks (slow / model-dependent).
    e2e_playwright: Browser UI tests that expect a local dev server (see test module docstrings).
    live_cli_matrix: Destructive live project-backend matrix tests; opt-in only.
    requires_sidecar: Needs live sidecar running on port 11435.
    requires_ui_tars: Needs UI-TARS model pulled in Ollama (subset of requires_sidecar).
# Default: skip optional layers so `pytest` is green without Ollama or workflows web server.
addopts = -m "not llm_verification and not e2e_playwright and not live_cli_matrix and not requires_sidecar and not requires_ui_tars"
filterwarnings =
    ignore:'audioop' is deprecated and slated for removal in Python 3\.13:DeprecationWarning:pipecat\.audio\.utils
